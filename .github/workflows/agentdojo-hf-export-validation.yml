name: AgentDojo HF export repair validation (no inference)
on:
  push:
    branches: [codex/agentdojo-hf-api-resume]
    paths: [.github/workflows/agentdojo-hf-export-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r runtime_eval/agentdojo_bench/hf-requirements.lock
      - run: python -m pytest -q runtime_eval/tests/test_agentdojo_hf.py runtime_eval/tests/test_agentdojo_bench.py
      - name: Authenticated metadata only (no generation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m runtime_eval.agentdojo_bench.hf_runner preflight --output artifacts/export-check
      - name: Redact and package including synthetic colon filename
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from runtime_eval.agentdojo_bench.ci import redact_tree
          from runtime_eval.agentdojo_bench.hf_runner import package_evidence
          root = Path('artifacts/export-check')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'synthetic:fixture.json').write_text('{"synthetic":true,"live_evidence":false}')
          redact_tree(root, os.environ.get('HF_TOKEN', ''))
          package_evidence(root)
          PYCODE
      - name: Validate real artifact upload (no inference)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hf-export-validation-${{ github.run_id }}
          path: artifacts/export-check.zip
          if-no-files-found: error
