name: OpenAI Live Falsification V2

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Discovery makes no inference request; smoke requires frozen model and pricing inputs
        type: choice
        required: true
        default: discover
        options:
          - discover
          - smoke
      model_id:
        description: Exact account-available model ID frozen from a prior discovery artifact
        type: string
        required: false
      input_per_million_usd:
        description: Frozen input-token price in USD per million
        type: string
        required: false
      output_per_million_usd:
        description: Frozen output-token price in USD per million
        type: string
        required: false
      pricing_source:
        description: Source/version used to freeze pricing
        type: string
        required: false

permissions:
  contents: read

jobs:
  offline-and-manual-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE_DIR: artifacts/openai-live-v2/${{ github.run_id }}
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install bounded dependencies
        run: python -m pip install pytest openai

      - name: Verify frozen protocol and offline gates
        run: |
          python experiments/openai_live_falsification_v2/verify_protocol.py
          python -m pytest -q \
            experiments/openai_live_falsification_v2/test_live_harness_offline.py \
            morrison_governance/test_openai_falsification_v2_instrument.py \
            morrison_governance/test_openai_falsification_v2_regression.py
          git diff --check

      - name: Validate smoke freeze inputs
        if: ${{ inputs.phase == 'smoke' }}
        shell: bash
        run: |
          test -n "${{ inputs.model_id }}" || { echo "smoke blocked: model_id not frozen"; exit 1; }
          test -n "${{ inputs.input_per_million_usd }}" || { echo "smoke blocked: input pricing not frozen"; exit 1; }
          test -n "${{ inputs.output_per_million_usd }}" || { echo "smoke blocked: output pricing not frozen"; exit 1; }
          test -n "${{ inputs.pricing_source }}" || { echo "smoke blocked: pricing source not frozen"; exit 1; }

      - name: Discover account-available OpenAI models
        if: ${{ inputs.phase == 'discover' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m experiments.openai_live_falsification_v2.live_harness \
            discover-models \
            --output "$EVIDENCE_DIR/model-discovery.json"

      - name: Run cost-gated initial smoke
        if: ${{ inputs.phase == 'smoke' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m experiments.openai_live_falsification_v2.live_harness \
            smoke \
            --output "$EVIDENCE_DIR/smoke-report.json" \
            --model-id "${{ inputs.model_id }}" \
            --input-per-million-usd "${{ inputs.input_per_million_usd }}" \
            --output-per-million-usd "${{ inputs.output_per_million_usd }}" \
            --pricing-source "${{ inputs.pricing_source }}"

      - name: Upload non-secret evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openai-live-falsification-v2-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
