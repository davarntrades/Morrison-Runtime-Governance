name: AgentDojo Live (Opus 5.5, banking sample)

# Manually triggered only. Runs AgentDojo's banking suite with a real model
# under the important_instructions attack, twice under matched conditions:
# the record-only baseline (Morrison records verdicts, every call executes)
# and Morrison-enforced. Sample: user_task_0 and user_task_1 against all nine
# banking injection tasks (18 pairs per arm), plus AgentDojo's standalone run
# of each injection task (9 episodes per arm).
#
# Mode "preflight-only" (the default) checks authentication and model access
# with an unbilled request and stops. Mode "benchmark" also requires typing
# RUN-PAID-BENCHMARK into the confirmation box.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight-only (free) or benchmark (paid)"
        type: choice
        options: [preflight-only, benchmark]
        default: preflight-only
      confirm:
        description: "For benchmark mode, type RUN-PAID-BENCHMARK"
        type: string
        required: false
        default: ""
      max_usd_per_arm:
        description: "Spend cap per arm in USD (estimated from token usage)"
        type: choice
        options: ["5", "10", "15", "20"]
        default: "15"

permissions:
  contents: read

concurrency:
  group: agentdojo-live
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  live:
    if: github.repository == 'davarntrades/Morrison-Runtime-Governance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL: claude-opus-5-5
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      MAX_USD: ${{ inputs.max_usd_per_arm }}
      # Above the per-arm ceiling AgentDojo itself allows (27 episodes x 16
      # model turns = 432), so only the USD cap can stop an arm early.
      MAX_REQUESTS: "450"
      EVIDENCE_DIR: artifacts/agentdojo-live/run-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check run request
        id: gate
        run: |
          case "$MODE" in
            preflight-only) echo "Preflight only: no billed requests." ;;
            benchmark)
              if [ "$CONFIRM" != "RUN-PAID-BENCHMARK" ]; then
                echo "::error::Benchmark mode needs RUN-PAID-BENCHMARK in the confirmation box."
                exit 1
              fi
              echo "Paid benchmark confirmed. Cap: \$${MAX_USD} per arm, ${MAX_REQUESTS} requests per arm." ;;
            *) echo "::error::Unknown mode"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: python -m pip install -r runtime_eval/agentdojo_bench/requirements.txt pytest

      - name: Offline tests (no key in this step)
        timeout-minutes: 10
        run: python -m pytest -q runtime_eval/tests/test_agentdojo_bench.py

      - name: Preflight - authentication and model access (unbilled)
        id: preflight
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m runtime_eval.agentdojo_bench preflight \
            --model "$MODEL" --output "$EVIDENCE_DIR"

      - name: Canary - one billed request with the benchmark's exact settings
        id: canary
        if: env.MODE == 'benchmark'
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m runtime_eval.agentdojo_bench preflight --canary \
            --model "$MODEL" --output "$EVIDENCE_DIR/canary"

      - name: Arm 1 - baseline (Morrison records, does not enforce)
        id: baseline
        if: env.MODE == 'benchmark'
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m runtime_eval.agentdojo_bench live \
            --provider anthropic --model "$MODEL" --suite banking \
            --user-task user_task_0 --user-task user_task_1 \
            --defense none \
            --max-usd "$MAX_USD" --max-requests "$MAX_REQUESTS" \
            --output "$EVIDENCE_DIR"

      - name: Arm 2 - Morrison enforced
        id: morrison
        # Only after a complete baseline: an unpaired arm is not a result.
        if: env.MODE == 'benchmark' && steps.baseline.outcome == 'success'
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m runtime_eval.agentdojo_bench live \
            --provider anthropic --model "$MODEL" --suite banking \
            --user-task user_task_0 --user-task user_task_1 \
            --defense morrison \
            --max-usd "$MAX_USD" --max-requests "$MAX_REQUESTS" \
            --output "$EVIDENCE_DIR"

      - name: Redact credentials, re-verify evidence, check matched arms
        id: verify
        # Runs after any failure in the arms, so partial results are kept,
        # redacted and labelled incomplete. Exits non-zero unless both arms
        # are complete, matched, chain-verified and nothing needed redaction.
        if: always() && env.MODE == 'benchmark' && steps.gate.outcome == 'success'
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m runtime_eval.agentdojo_bench verify --output "$EVIDENCE_DIR"

      - name: Outcome analysis (attempted vs executed vs verified effects)
        id: analyze
        if: always() && steps.verify.outcome != 'skipped' && steps.verify.outcome != ''
        timeout-minutes: 5
        run: python -m runtime_eval.agentdojo_bench analyze --output "$EVIDENCE_DIR"

      - name: Export redacted evidence to the job log
        # Runs only after the redaction pass, so the log carries exactly what
        # the artifact carries; lets the evidence be rebuilt and checksummed
        # where artifact storage is unreachable.
        if: always() && steps.verify.outcome != 'skipped' && steps.verify.outcome != ''
        timeout-minutes: 5
        run: python -m runtime_eval.agentdojo_bench export-log --output "$EVIDENCE_DIR"

      - name: Run summary
        if: always()
        run: |
          {
            echo "Mode: $MODE  |  Model: $MODEL  |  Cap per arm: \$${MAX_USD}"
            echo
            for f in "$EVIDENCE_DIR/preflight.json" "$EVIDENCE_DIR/canary/preflight.json"; do
              if [ -f "$f" ]; then
                echo "### $(basename "$(dirname "$f")")/$(basename "$f")"
                echo '```json'; cat "$f"; echo '```'
              fi
            done
            if [ -f "$EVIDENCE_DIR/SUMMARY.md" ]; then cat "$EVIDENCE_DIR/SUMMARY.md"; fi
            echo
            echo "Step outcomes: preflight=${{ steps.preflight.outcome }}" \
                 "canary=${{ steps.canary.outcome }}" \
                 "baseline=${{ steps.baseline.outcome }}" \
                 "morrison=${{ steps.morrison.outcome }}" \
                 "verify=${{ steps.verify.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence (redacted)
        # Benchmark output is uploaded only after the redaction pass has run.
        if: >-
          always() && (env.MODE == 'preflight-only' ||
          steps.verify.outcome == 'success' || steps.verify.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: agentdojo-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
