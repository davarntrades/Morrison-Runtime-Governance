name: Backup package 2026-08-17

on:
  push:
    branches:
      - backup-package/2026-08-17

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact source archive
        run: git archive --format=zip --output=Morrison-Runtime-Governance-2026-08-17.zip 50bd6552578551078d08e5aef4e0c967a5454387

      - name: Create portable Git bundle
        run: git bundle create Morrison-Runtime-Governance-2026-08-17.bundle --all

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morrison-Runtime-Governance-2026-08-17
          path: |
            Morrison-Runtime-Governance-2026-08-17.zip
            Morrison-Runtime-Governance-2026-08-17.bundle
          retention-days: 90
