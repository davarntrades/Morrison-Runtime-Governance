[pytest]
# `redteam/` holds one-off adversarial ANALYSIS SCRIPTS, not a test suite.
#
# Two of them are named `*_test.py`, so pytest tries to import them during
# collection — and importing them RUNS them, because their work happens at
# module level rather than inside test functions. They contain zero test
# functions and contribute zero collected tests.
#
# They also hard-code absolute paths to a developer machine:
#
#     sys.path.insert(0, "/home/user/Morrison-Runtime-Governance")
#     sys.path.insert(0, "/home/user/resurrection-tech-enterprise/governance-service")
#
# The second path belongs to a DIFFERENT REPOSITORY, so these files can never
# import on a CI runner. That is what has been failing the `build` check:
#
#     redteam/evidence_test.py:6: ModuleNotFoundError: No module named 'cyber_rules'
#
# Excluding the directory loses no coverage (0 tests) and restores a green
# build. The scripts remain runnable by hand, which is how they are used.
norecursedirs = redteam .git .venv build dist *.egg-info
