const TOTAL=scenes.reduce((a,s)=>a+s.dur,0);
function render(t){
  x.setTransform(S,0,0,S,0,0);GA=1;x.globalAlpha=1;x.fillStyle=BG;x.fillRect(0,0,W,H);
  x.fillStyle=GRID;for(let gx=0;gx<W+40;gx+=40)for(let gy=20;gy<H;gy+=40){x.beginPath();x.arc((gx+t*6)%(W+40),gy,1.5,0,7);x.fill()}
  let s0=0;for(const s of scenes){if(t<s0+s.dur){const lt=t-s0;
      GA=Math.min(eo(prog(lt,0,.35)),1-eio(prog(lt,s.dur-.45,.45)));if(s0===0)GA=1-eio(prog(lt,s.dur-.45,.45));
      x.save();s.draw(lt);x.restore();break}s0+=s.dur}
  GA=1;x.globalAlpha=1;
  // progress rail
  x.fillStyle=LINE;x.fillRect(0,H-3,W,3);x.fillStyle=ACC;x.fillRect(0,H-3,W*clamp(t/TOTAL),3);
}
