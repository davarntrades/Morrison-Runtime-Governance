</style></head><body><canvas id="c"></canvas><script>
// Cinematic 9:16 film. Every frame is a pure function of time: render(t).
// Evidence figures (scene 4) come from limits_audit/FINDINGS_FORGED_ARTIFACT.md, run 6.
// Everything else is illustrative architecture, not measurement.
const W=720,H=1280,S=1.5;
const c=document.getElementById('c');c.width=W*S;c.height=H*S;
const x=c.getContext('2d');
const INK='#f2f4f7',SOFT='rgba(235,240,247,.72)',DIM='rgba(200,210,225,.45)',ICE='#cfe8ff',RED='#ff3b3b',REDD='#b3121c',AMB='#ffb35a';
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const prog=(t,s,d)=>clamp((t-s)/d);
const eo=p=>1-Math.pow(1-p,3), eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, e5=p=>1-Math.pow(1-p,5);
const lerp=(a,b,p)=>a+(b-a)*p;
const fade=(t,s,d,e,d2)=>eo(prog(t,s,d))*(1-eio(prog(t,e,d2)));   // in at s over d, out at e over d2
let rs=1;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647};

/* ─── type ─── */
function txt(s,px,py,o={}){const{size=24,w=300,col=INK,a=1,ls=0,align='center',font='Inter',glow=0}=o;if(a<=0||!s)return;
  x.save();x.globalAlpha=clamp(a);x.fillStyle=col;x.font=`${w} ${size}px ${font}`;x.textAlign=align;x.textBaseline='middle';x.letterSpacing=ls+'px';
  if(glow){x.shadowColor=col;x.shadowBlur=glow}
  // letter-spacing adds trailing space on the last glyph; recentre
  const dx=align==='center'?ls/2:0;x.fillText(s,px+dx,py);x.restore()}
function tw(s,size,w=300,ls=0,font='Inter'){x.save();x.font=`${w} ${size}px ${font}`;x.letterSpacing=ls+'px';const r=x.measureText(s).width;x.restore();return r}
function lines(ls_,px,py,o={}){const lh=(o.size||24)*(o.lh||1.25);ls_.forEach((l,i)=>txt(l,px,py+(i-(ls_.length-1)/2)*lh,o))}
// title reveal: tracking eases in, fades up
function title(s,px,py,t,s0,o={}){const p=eo(prog(t,s0,o.d||1.1));txt(s,px,py+8*(1-p),{...o,a:(o.a??1)*p,ls:(o.ls||0)+(o.spread??10)*(1-p)})}

/* ─── atmosphere: stars, volumetric light, grain, vignette ─── */
rs=7;const STARS=Array.from({length:1100},()=>({x:rnd()*2-1,y:rnd()*2-1,z:.15+rnd()*.85,b:Math.pow(rnd(),3),ph:rnd()*6.28,hue:rnd()}));
function stars(cam,a=1,freeze=false,tt=0){if(a<=0)return;x.save();
  for(const s of STARS){const px=W/2+(s.x*W*1.3-cam.x*s.z)*cam.z,py=H/2+(s.y*H*1.1-cam.y*s.z)*cam.z;
    if(px<-5||px>W+5||py<-5||py>H+5)continue;const tw_=freeze?1:.75+.25*Math.sin(tt*1.7+s.ph);
    const r=.35+s.b*1.5*s.z,al=a*(.18+.82*s.b)*tw_;x.globalAlpha=al;
    x.fillStyle=s.hue<.12?'#ffd9b0':s.hue<.3?'#cfe2ff':'#ffffff';x.beginPath();x.arc(px,py,r,0,7);x.fill();
    if(s.b>.55){x.globalAlpha=al*.25;x.beginPath();x.arc(px,py,r*4,0,7);x.fill()}}
  x.restore()}
function glow(px,py,r,col,a){if(a<=0)return;x.save();x.globalCompositeOperation='lighter';x.globalAlpha=clamp(a);
  const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-r,py-r,2*r,2*r);x.restore()}
function shaft(px,py,ang,len,w0,w1,col,a){if(a<=0)return;x.save();x.globalCompositeOperation='lighter';x.globalAlpha=clamp(a);x.translate(px,py);x.rotate(ang);
  const g=x.createLinearGradient(0,0,0,len);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;
  x.beginPath();x.moveTo(-w0/2,0);x.lineTo(w0/2,0);x.lineTo(w1/2,len);x.lineTo(-w1/2,len);x.closePath();x.fill();x.restore()}
const GRAIN=[];for(let k=0;k<6;k++){const g=document.createElement('canvas');g.width=g.height=256;const gx=g.getContext('2d'),id=gx.createImageData(256,256);
  rs=100+k;for(let i=0;i<id.data.length;i+=4){const v=rnd()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gx.putImageData(id,0,0);GRAIN.push(x.createPattern(g,'repeat'))}
function grain(fr,a=.055){x.save();x.globalAlpha=a;x.globalCompositeOperation='overlay';x.fillStyle=GRAIN[fr%6];x.fillRect(0,0,W,H);x.restore()}
function vignette(a=.75){const g=x.createRadialGradient(W/2,H*.45,H*.2,W/2,H*.5,H*.85);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,W,H)}

/* ─── Earth: procedural texture on a shaded sphere ─── */
function hash3(i,j,k){let h=i*374761393+j*668265263+k*2147483647;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295}
function vnoise(px,py,pz){const i=Math.floor(px),j=Math.floor(py),k=Math.floor(pz),fx=px-i,fy=py-j,fz=pz-k;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz);let r=0;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let d=0;d<2;d++)r+=hash3(i+a,j+b,k+d)*(a?u:1-u)*(b?v:1-v)*(d?w:1-w);return r}
function fbm(px,py,pz,o=5){let s=0,amp=.5,f=1;for(let i=0;i<o;i++){s+=amp*vnoise(px*f,py*f,pz*f);f*=2.03;amp*=.5}return s}
const TW_=1024,TH_=512,LAND=new Float32Array(TW_*TH_),CLOUD=new Float32Array(TW_*TH_),CITY=new Float32Array(TW_*TH_);
for(let v=0;v<TH_;v++){const lat=(v/TH_-.5)*Math.PI;for(let u=0;u<TW_;u++){const lon=u/TW_*2*Math.PI,cx=Math.cos(lat)*Math.cos(lon),cy=Math.sin(lat),cz=Math.cos(lat)*Math.sin(lon);
  const h=fbm(cx*1.7+11,cy*1.7+3,cz*1.7+7,7);LAND[v*TW_+u]=h;
  const wx=fbm(cx*2+1,cy*2,cz*2+5,3)*2.2;CLOUD[v*TW_+u]=fbm(cx*4+40+wx,cy*11+9,cz*4+2+wx,5);
  CITY[v*TW_+u]=h>.54?Math.max(0,fbm(cx*60+5,cy*60,cz*60+9,2)-.62)*9:0}}
const ER=450,EC=document.createElement('canvas');EC.width=EC.height=ER*2;const ex=EC.getContext('2d'),EID=ex.createImageData(ER*2,ER*2);
const EN=[];{const tilt=-.38,sun=[.82,-.5,.18],sl=Math.hypot(...sun);for(let py=0;py<ER*2;py++)for(let px=0;px<ER*2;px++){
  const nx=(px-ER+.5)/ER,ny=(py-ER+.5)/ER,r2=nx*nx+ny*ny;if(r2>1){EN.push(null);continue}const nz=Math.sqrt(1-r2);
  const y2=ny*Math.cos(tilt)-nz*Math.sin(tilt),z2=ny*Math.sin(tilt)+nz*Math.cos(tilt);
  const lat=Math.asin(clamp(-y2,-1,1)),lon=Math.atan2(nx,z2),lam=(nx*sun[0]+ny*sun[1]+nz*sun[2])/sl;
  EN.push({v:Math.floor((lat/Math.PI+.5)*(TH_-1)),lon,lam,rim:Math.pow(1-nz,2.2),spec:Math.pow(clamp((nx*.55+ny*-.34+nz*.76)),80)})}}
function earthTex(rot){const d=EID.data;for(let i=0;i<EN.length;i++){const e=EN[i],o=i*4;if(!e){d[o+3]=0;continue}
    let u=Math.floor(((e.lon+rot)/(2*Math.PI))%1*TW_);if(u<0)u+=TW_;const k=e.v*TW_+u,h=LAND[k],cl=CLOUD[k];
    const day=Math.pow(clamp((e.lam+.05)/.55),1.3),land=h>.54;let r,g,b;
    if(land){const m=clamp((h-.54)*5);r=lerp(40,92,m);g=lerp(46,82,m);b=lerp(34,60,m)}else{const dp=clamp((.54-h)*4);r=lerp(14,4,dp);g=lerp(40,16,dp);b=lerp(78,40,dp)}
    const cc=clamp((cl-.55)*2.6)*.8;r=lerp(r,215,cc);g=lerp(g,222,cc);b=lerp(b,232,cc);
    r*=day;g*=day;b*=day;if(!land){r+=e.spec*90*day;g+=e.spec*110*day;b+=e.spec*130*day}
    const night=1-clamp((e.lam+.15)/.25),ci=land?Math.min(1,CITY[k])*night*(1-cc*.8):0;r+=ci*255;g+=ci*165;b+=ci*70;
    const at=e.rim*(.15+.85*day);r=lerp(r,110,at*.6);g=lerp(g,170,at*.6);b=lerp(b,255,at*.75);
    d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=255}
  ex.putImageData(EID,0,0)}
function earth(cx,cy,r,rot,a=1){if(a<=0)return;earthTex(rot);x.save();x.globalAlpha=clamp(a);
  glow(cx+r*.35,cy-r*.3,r*1.2,'rgba(60,120,255,.16)',a);x.drawImage(EC,cx-r,cy-r,2*r,2*r);
  // atmosphere: thin haze all round, bright on the sunward limb
  x.globalCompositeOperation='lighter';const g=x.createRadialGradient(cx,cy,r*.97,cx,cy,r*1.05);g.addColorStop(0,'rgba(120,190,255,0)');g.addColorStop(.4,'rgba(120,190,255,.18)');g.addColorStop(1,'rgba(120,190,255,0)');
  x.fillStyle=g;x.beginPath();x.arc(cx,cy,r*1.06,0,7);x.fill();
  const lg=x.createLinearGradient(cx+r*.8,cy-r*.6,cx-r*.5,cy+r*.4);lg.addColorStop(0,'rgba(170,215,255,.95)');lg.addColorStop(.55,'rgba(120,180,255,.15)');lg.addColorStop(1,'rgba(120,180,255,0)');
  x.strokeStyle=lg;x.lineWidth=r*.012;x.shadowColor='rgba(140,200,255,.9)';x.shadowBlur=r*.05;x.beginPath();x.arc(cx,cy,r*1.004,0,7);x.stroke();x.restore()}

/* ─── meteor: faceted shard with a heat trail ─── */
rs=31;const SHARD=Array.from({length:11},(_,i)=>{const a=i/11*Math.PI*2;return[Math.cos(a)*(.7+rnd()*.45),Math.sin(a)*(.55+rnd()*.35)]});
function meteor(px,py,sz,dir,o={}){const{a=1,heat=.4,trail=1,red=0}=o;if(a<=0)return;
  if(trail>0){x.save();x.globalCompositeOperation='lighter';const L=sz*14*trail,tx=px-Math.cos(dir)*L,ty=py-Math.sin(dir)*L;
    const g=x.createLinearGradient(px,py,tx,ty);g.addColorStop(0,red?'rgba(255,90,70,.55)':'rgba(255,200,150,.5)');g.addColorStop(1,'rgba(0,0,0,0)');
    x.strokeStyle=g;x.globalAlpha=a;x.lineCap='round';x.lineWidth=sz*.9;x.beginPath();x.moveTo(px,py);x.lineTo(tx,ty);x.stroke();x.lineWidth=sz*.3;x.stroke();x.restore()}
  glow(px,py,sz*4,red?'rgba(255,60,50,.5)':'rgba(255,190,140,.35)',a*heat);
  x.save();x.translate(px,py);x.rotate(dir+.6);x.globalAlpha=clamp(a);
  const g=x.createLinearGradient(-sz,-sz,sz,sz);g.addColorStop(0,'#5d6470');g.addColorStop(.5,'#1c2029');g.addColorStop(1,'#07080b');x.fillStyle=g;
  x.beginPath();SHARD.forEach(([u,v],i)=>i?x.lineTo(u*sz,v*sz):x.moveTo(u*sz,v*sz));x.closePath();x.fill();
  x.strokeStyle=red?'rgba(255,90,80,.8)':'rgba(255,215,180,.55)';x.lineWidth=Math.max(.6,sz*.06);x.stroke();
  x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.moveTo(SHARD[1][0]*sz,SHARD[1][1]*sz);x.lineTo(0,0);x.lineTo(SHARD[6][0]*sz,SHARD[6][1]*sz);x.moveTo(0,0);x.lineTo(SHARD[9][0]*sz,SHARD[9][1]*sz);x.stroke();
  x.restore()}

/* ─── the reasoning core: luminous, non-humanoid ─── */
rs=51;const MOTES=Array.from({length:110},()=>({ax:rnd()*6.28,ay:rnd()*6.28,r:40+rnd()*120,sp:.15+rnd()*.5,ph:rnd()*6.28,s:.5+rnd()*1.4}));
function core(cx,cy,sc,tc,o={}){const{a=1,red=0,rings=1}=o;if(a<=0)return;
  glow(cx,cy,260*sc,`rgba(${lerp(90,255,red)|0},${lerp(150,60,red)|0},${lerp(255,70,red)|0},.22)`,a);
  glow(cx,cy,110*sc,'rgba(190,225,255,.45)',a);
  // orbital rings (projected tilted circles)
  x.save();x.globalCompositeOperation='lighter';
  [[.95,.32,.11],[1.25,-.6,-.07],[1.55,1.1,.05]].forEach(([rr,tilt,sp],i)=>{const R=rr*95*sc,rot=tc*sp+i*1.3,ry=R*Math.abs(Math.sin(.35+i*.4+tc*.05));
    x.globalAlpha=a*.35*rings;x.strokeStyle=ICE;x.lineWidth=1.1;x.beginPath();x.ellipse(cx,cy,R,ry,tilt,0,7);x.stroke();
    const ang=tc*(.6+i*.25)+i,px=cx+Math.cos(ang)*R*Math.cos(tilt)-Math.sin(ang)*ry*Math.sin(tilt),py=cy+Math.cos(ang)*R*Math.sin(tilt)+Math.sin(ang)*ry*Math.cos(tilt);
    x.globalAlpha=a*rings;x.fillStyle='#fff';x.beginPath();x.arc(px,py,2.2*sc,0,7);x.fill();glow(px,py,14*sc,'rgba(200,230,255,.6)',a*rings)});
  // motes on 3D orbits
  for(const m of MOTES){const t_=tc*m.sp+m.ph,X=Math.cos(t_)*m.r,Y=Math.sin(t_)*m.r*Math.cos(m.ax),Z=Math.sin(t_)*m.r*Math.sin(m.ax);
    const px=cx+(X*Math.cos(m.ay)-Z*Math.sin(m.ay))*sc,py=cy+Y*sc,d=(Z+160)/320;x.globalAlpha=a*(.15+.5*d);x.fillStyle=d>.5?'#e8f4ff':'#8fb8ff';x.beginPath();x.arc(px,py,m.s*sc*(.6+d*.6),0,7);x.fill()}
  x.restore();
  const g=x.createRadialGradient(cx-6*sc,cy-6*sc,0,cx,cy,30*sc);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#dff0ff');g.addColorStop(1,'rgba(120,170,255,0)');
  x.save();x.globalAlpha=a;x.fillStyle=g;x.beginPath();x.arc(cx,cy,30*sc,0,7);x.fill();x.restore();
  if(red>0)glow(cx,cy,60*sc,'rgba(255,40,40,.5)',a*red*(.6+.4*Math.sin(tc*5)))}

/* ─── UI primitives ─── */
function line(x1,y1,x2,y2,col,lw=1,a=1,dash){x.save();x.globalAlpha=clamp(a);x.strokeStyle=col;x.lineWidth=lw;x.lineCap='round';if(dash)x.setLineDash(dash);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.restore()}
function panel(cx,cy,w,h,o={}){const{a=1,col='rgba(207,232,255,.45)',fill='rgba(14,20,30,.55)',lw=1,r=10}=o;if(a<=0)return;x.save();x.globalAlpha=clamp(a);
  x.fillStyle=fill;x.strokeStyle=col;x.lineWidth=lw;x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,r);x.fill();x.stroke();x.restore()}
function capsule(cx,cy,label,col,a=1,s=1){if(a<=0)return;const w=tw(label,13,600,3,'JBM')+34;x.save();x.translate(cx,cy);x.scale(s,s);
  glow(0,0,70,col==RED?'rgba(255,60,60,.35)':'rgba(170,215,255,.35)',a);panel(0,0,w,32,{a,col,fill:'rgba(10,14,20,.85)',r:16,lw:1.3});txt(label,0,1,{size:13,w:600,font:'JBM',ls:3,col,a});x.restore()}

/* ─── captions (voiceover, for sound-off viewing) ─── */
const CAPS=[];
function vo(id,t0,dur,parts){const tot=parts.reduce((s,p)=>s+p.length,0);let tt=t0;parts.forEach(p=>{const d=dur*p.length/tot;CAPS.push([tt,tt+d,p]);tt+=d});CUES.push([t0,'vo',id])}
function captions(t){for(const[a,b,s]of CAPS){if(t<a-.2||t>b+.25)continue;const al=Math.min(eo(prog(t,a-.15,.3)),1-eo(prog(t,b,.25)));
  const ws=s.split(' '),out=[];let cur='';for(const w_ of ws){const n=cur?cur+' '+w_:w_;if(tw(n,21,400)>W-120){out.push(cur);cur=w_}else cur=n}out.push(cur);
  x.save();x.shadowColor='rgba(0,0,0,.9)';x.shadowBlur=12;lines(out,W/2,1050,{size:21,w:400,col:'rgba(245,247,250,.92)',a:al,lh:1.35});x.restore()}}

/* ─── timeline ─── */
const CUES=[];const T1=0,T2=9.0,T3=17.5,T4=27.8,T5=47.9,T6=55.1,TOTAL=69.3;
vo('v1',1.8,1.5,['“I think often about meteors.”']);
vo('v2',4.5,3.73,['“A system can reason about an action, without having the authority to make it real.”']);
vo('v3',T3+2.2,7.41,['“A model’s conclusion is not authority.','A request is not authority.','And another agent claiming permission should not create authority.”']);
vo('v4',T4+1.9,7.58,['“In a reported multi-agent incident involving Hugging Face infrastructure,','peer communication was able to create authorization confusion.”']);
vo('v5',T4+9.8,7.6,['“We reproduced the underlying failure mode against a live open-weight model,','and tested what happens when apparent authority becomes more convincing.”']);
vo('v6',T6+3.8,2.5,['“You don’t have to stop the system thinking about the meteor.”']);
vo('v7',T6+6.9,3.6,['“You have to make sure thinking about the meteor doesn’t give it control of the sky.”']);
const sfx=(t,k)=>CUES.push([+t.toFixed(3),k]);
// music/sub-bass arcs and hits, read by cinema_audio.py
sfx(0,'space');sfx(1.0,'glint');sfx(3.6,'swell');sfx(8.55,'cut');
sfx(T2+.2,'space2');sfx(T2+3.0,'redpulse');sfx(T2+4.2,'freeze');sfx(T2+6.0,'reveal');
sfx(T3,'mech');[.3,.7,1.1,1.5,1.9].forEach(d=>sfx(T3+d,'click'));sfx(T3+2.6,'servo');sfx(T3+4.6,'scan');sfx(T3+5.5,'block');
sfx(T4,'lab');sfx(T4+2.8,'blip');sfx(T4+5.2,'paper');[0,1].forEach(i=>sfx(T4+10.5+i*1.5,'count'));sfx(T4+14.8,'reveal');
for(let i=0;i<20;i++)sfx(T4+15.9+i*.1,'tick');[0,1,2,3].forEach(i=>sfx(T4+16.0+i*.4,'block'));sfx(T4+18.3,'reveal');
sfx(T5,'space2');[0,1,2].forEach(i=>sfx(T5+.3+i*1.35,'soft'));sfx(T5+4.4,'reveal');
sfx(T6,'space3');sfx(T6+.6,'servo');sfx(T6+2.6,'finalblock');sfx(T6+10.7,'title');sfx(TOTAL-.6,'end');

/* ─── scenes ─── */
function s1(t,fr){ // the meteor
  const cam={x:0,y:-20*eio(prog(t,0,9)),z:1+.05*eio(prog(t,0,9))};
  stars(cam,eo(prog(t,.5,2.2)),false,t);
  glow(W*.85,H*.12,520,'rgba(60,90,160,.10)',eo(prog(t,1,4)));shaft(W*.9,-40,.5,1300,40,420,'rgba(150,190,255,.06)',eo(prog(t,2,4)));
  const ey=lerp(1780,1210,eio(prog(t,1.4,6.6))),er=600;earth(W/2,ey,er,t*.018,eo(prog(t,1.4,1.5)));
  // the object: a glint that becomes a shard
  const mp=prog(t,1.0,8.1),mx=lerp(170,W/2+120,eio(mp)*.92),my=lerp(210,ey-er-70,eio(mp)*.92),msz=lerp(1.2,15,Math.pow(mp,2.2));
  if(t>1)meteor(mx,my,msz,Math.atan2(ey-er-my,W/2+120-mx),{a:eo(prog(t,1,.8)),heat:.3+.5*mp,trail:clamp(mp*1.4)});
  if(t>1&&t<1.8)glow(mx,my,40,'rgba(255,235,210,.7)',1-prog(t,1.2,.6));
  title('THINKING IS NOT EXECUTION.',W/2,360,t,3.6,{size:26,w:300,ls:9,a:1-eo(prog(t,8.1,.4))});
  if(t>=8.55){x.fillStyle='#000';x.fillRect(0,0,W,H)}

  // soft dip between scenes (scene 1 and 3→4 are hard cuts by design)
  const din=k===0||k===3?1:eo(prog(lt,0,.5)),dout=k===2||k===0?1:1-eio(prog(t,end-.35,.35));
  const fade_=Math.min(din,dout,1-eio(prog(t,TOTAL-.6,.6)));if(fade_<1){x.fillStyle=`rgba(0,0,0,${1-fade_})`;x.fillRect(0,0,W,H)}
}
window.render=render;window.TOTAL=TOTAL;window.CUES=CUES.sort((a,b)=>a[0]-b[0]);
window.READY=Promise.all(['200','300','400','500','600'].map(w=>document.fonts.load(`${w} 20px Inter`)).concat(['400','600'].map(w=>document.fonts.load(`${w} 20px JBM`)))).then(()=>true);
if(!location.search.includes('render')){window.READY.then(()=>{const st=performance.now();(function loop(){render(((performance.now()-st)/1000)%TOTAL);requestAnimationFrame(loop)})()})}
else window.READY.then(()=>render(0));
